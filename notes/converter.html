<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محوّل المعادلات · عامر رواشدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Math&display=swap" rel="stylesheet">
<script>
  // Latin view: turn the Arabic letters back into the Latin ones from the mapping box.
  (function () {
    // Only a mapping the reader edited is needed here; otherwise arabic-math.js uses its standard letters.
    var text = '';
    try { text = localStorage.getItem('converter-map-v2') || ''; } catch (e) {}
    var back = {};
    text.split(/\s+/).forEach(function (p) {
      var kv = p.split('=');
      if (kv.length === 2 && kv[0] && kv[1]) {
        if (kv[1] === 'هـ') { back['ه'] = kv[0]; back['ـ'] = ''; } else back[kv[1]] = kv[0];
      }
    });
    window.ArabicMathLatin = back;
  })();
</script>
<script src="arabic-math.js?v=18"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
<style>
  :root {
    --bg: #fbfaf7; --text: #1f2328; --muted: #5b6470;
    --accent: #0c4a6e; --rule: #e3e0d8; --box: #f2f0ea; --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171b; --text: #e6e6e3; --muted: #a0a7b0;
            --accent: #7cc4ec; --rule: #2a2f36; --box: #1c2026; --field: #101317; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Noto Naskh Arabic", "Amiri", serif; font-size: 18px; line-height: 1.8; }
  a { color: var(--accent); text-decoration: none; }
  nav { border-bottom: 1px solid var(--rule); font-size: 15px; }
  nav .inner { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap;
               gap: 8px 18px; align-items: center; }
  nav .home { font-weight: 700; color: var(--text); margin-left: auto; }
  nav a { color: var(--muted); }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  textarea, input { width: 100%; font-size: 17px; color: var(--text); background: var(--field);
                    border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; }
  textarea.en { direction: ltr; text-align: left; font-family: ui-monospace, Menlo, Consolas, monospace;
                min-height: 110px; resize: vertical; }
  textarea.ar { direction: rtl; font-family: "Noto Naskh Arabic", serif; min-height: 110px; resize: vertical; }
  input.map { direction: rtl; font-size: 15px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  button { font: inherit; font-size: 15px; color: var(--text); background: var(--box);
           border: 1px solid var(--rule); border-radius: 6px; padding: 2px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .status { color: var(--muted); font-size: 15px; }
  .en-preview { margin-top: 8px; padding: 10px 16px; border: 1px dashed var(--rule); border-radius: 8px;
                min-height: 56px; overflow-x: auto; text-align: left; }
  .en-preview::before { content: "English"; display: block; font-family: Inter, system-ui, sans-serif;
                        font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  #preview { margin-top: 8px; padding: 12px 16px; border: 1px solid var(--rule); border-radius: 8px;
             background: var(--box); min-height: 70px; overflow-x: auto; }
  .note { font-size: 15px; color: var(--muted); }
  .examples button { font-size: 13px; direction: ltr; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<nav>
  <div class="inner">
    <a class="home" href="../index.html">الصفحة الرئيسية</a>
    <a href="editor.html">المحرر</a>
    <a href="commands.html">الأوامر</a>
  </div>
</nav>

<main>
  <h1>محوّل المعادلات</h1>
  <p class="lead">الصق معادلة LaTeX بالإنجليزية، فتظهر بالأوامر والحروف العربية.</p>

  <label for="en">المعادلة بالإنجليزية (LaTeX)</label>
  <textarea id="en" class="en" spellcheck="false">\lim_{x\to 3}\frac{x^2-9}{x-3} = 6</textarea>
  <div id="enPreview" class="en-preview" data-math-plain dir="ltr" aria-live="polite"></div>
  <div class="row examples">
    <span class="note">أمثلة:</span>
    <button type="button">\int_0^1 x^2\,dx = \frac{1}{3}</button>
    <button type="button">\frac{dy}{dx} = \sin x + \cos^2 x</button>
    <button type="button">\frac{\partial u}{\partial t} - \Delta u = f \text{ in } \Omega</button>
    <button type="button">\sum_{n=1}^{\infty} \frac{1}{n^2} = \frac{\pi^2}{6}</button>
    <button type="button">f : \mathbb{R} \to \mathbb{R},\ x \in \mathbb{R}, \ |x| \le 2</button>
  </div>

  <label for="map">الحروف (اللاتيني=العربي)</label>
  <input id="map" class="map" spellcheck="false">
  <div class="row">
    <span class="note">غيّر أي حرف كما تشاء. الحروف غير المذكورة تبقى لاتينية.</span>
    <button type="button" id="resetMap">استعادة الحروف الأصلية</button>
  </div>

  <label for="ar">النتيجة بالعربية</label>
  <textarea id="ar" class="ar" spellcheck="false" readonly></textarea>
  <div class="row">
    <button type="button" id="copy">نسخ النتيجة</button>
    <button type="button" id="png">حفظ كصورة PNG</button>
    <button type="button" id="svgdl">حفظ كـ SVG</button>
    <a href="editor.html" id="toEditor">فتح في المحرر</a>
    <span class="status" id="status"></span>
  </div>

  <label>المعاينة</label>
  <div id="preview" aria-live="polite"></div>
</main>

<script>
(function () {
  // The standard letters come from arabic-math.js, the same table every page uses.
  var DEFAULT_MAP = Object.keys(ArabicMath.letters).map(function (l) { return l + '=' + ArabicMath.letters[l]; }).join(' ');

  // Which Arabic command matches an English LaTeX command comes from the shared list in
  // arabic-math.js (ArabicMath.fromLatex), so a command added there converts here too.
  var ARABIC = /[؀-ۿ]/;

  var enBox = document.getElementById('en'), arBox = document.getElementById('ar'),
      mapBox = document.getElementById('map'), preview = document.getElementById('preview'),
      status = document.getElementById('status');

  function readMap() {
    var m = {};
    mapBox.value.split(/\s+/).forEach(function (p) {
      var kv = p.split('=');
      if (kv.length === 2 && /^[A-Za-z]$/.test(kv[0]) && kv[1]) m[kv[0]] = kv[1];
    });
    return m;
  }

  // English → Arabic conversion lives in arabic-math.js (ArabicMath.fromEnglish), shared with
  // pages whose math is written in English.
  function convert(src, map) { return ArabicMath.fromEnglish(src, map); }

  var timer = null;
  function update() {
    try { localStorage.setItem('converter-map-v2', mapBox.value); localStorage.setItem('converter-input', enBox.value); } catch (e) {}
    var result = convert(enBox.value, readMap());
    arBox.value = result;
    document.getElementById('toEditor').onclick = function () {
      try {
        var prev = localStorage.getItem('editor-text') || '';
        localStorage.setItem('editor-text', (prev ? prev + '\n\n' : '') + '$$' + result + '$$');
      } catch (e) {}
    };
    if (!window.ArabicMath || !MathJax.typesetClear) return;
    var enPreview = document.getElementById('enPreview');
    MathJax.typesetClear([preview, enPreview]);
    preview.textContent = '$$' + result + '$$';
    // The English input, drawn exactly as written.
    enPreview.textContent = enBox.value.trim() ? '$$' + enBox.value + '$$' : '';
    MathJax.typesetPromise([enPreview]).then(function () {
      return ArabicMath.typeset(preview);
    }).then(function () {
      var errEn = enPreview.querySelector('[data-mjx-error]');
      var err = preview.querySelector('[data-mjx-error]');
      status.textContent = errEn ? 'خطأ في المعادلة الإنجليزية: ' + errEn.getAttribute('data-mjx-error')
                       : err ? 'خطأ: ' + err.getAttribute('data-mjx-error') : '';
    });
  }
  function later() { clearTimeout(timer); timer = setTimeout(update, 300); }

  try {
    mapBox.value = localStorage.getItem('converter-map-v2') || DEFAULT_MAP;
    var saved = localStorage.getItem('converter-input'); if (saved) enBox.value = saved;
  } catch (e) { mapBox.value = DEFAULT_MAP; }

  enBox.addEventListener('input', later);
  mapBox.addEventListener('input', later);
  // In the Latin view the page maps Arabic letters back when it loads, so reload after a change.
  mapBox.addEventListener('change', function () {
    update();
    if (window.ArabicMath && ArabicMath.mode === 'latin') location.reload();
  });
  document.getElementById('resetMap').addEventListener('click', function () {
    mapBox.value = DEFAULT_MAP;
    try { localStorage.removeItem('converter-map-v2'); } catch (e) {}
    if (window.ArabicMath && ArabicMath.mode === 'latin') { location.reload(); return; }
    update();
    setTimeout(function () { status.textContent = 'أُعيدت الحروف الأصلية'; }, 500);
    setTimeout(function () { status.textContent = ''; }, 2500);
  });
  document.querySelectorAll('.examples button').forEach(function (b) {
    b.addEventListener('click', function () { enBox.value = b.textContent; update(); });
  });
  document.getElementById('copy').addEventListener('click', function () {
    if (navigator.clipboard) navigator.clipboard.writeText(arBox.value).then(function () {
      status.textContent = 'تم النسخ'; setTimeout(function () { status.textContent = ''; }, 1500);
    });
  });

  // ---------- Save the rendered equation as an image ----------
  // An image cannot load web fonts, so the Arabic and math fonts are embedded into it.
  var FONT_CSS = 'https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Math&display=swap';
  var fontCssPromise = null;
  function embeddedFonts() {
    if (!fontCssPromise) {
      fontCssPromise = fetch(FONT_CSS).then(function (r) { return r.text(); }).then(function (css) {
        var urls = css.match(/url\((https:[^)]+)\)/g) || [];
        return Promise.all(urls.map(function (u) {
          var url = u.slice(4, -1);
          return fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
            return new Promise(function (res) {
              var fr = new FileReader(); fr.onload = function () { res([url, fr.result]); }; fr.readAsDataURL(b);
            });
          });
        })).then(function (pairs) {
          pairs.forEach(function (p) { css = css.split(p[0]).join(p[1]); });
          return css;
        });
      }).catch(function () { fontCssPromise = null; return ''; });
    }
    return fontCssPromise;
  }

  // Build a standalone copy of the equation's SVG: mirrored for the Arabic view, black on white.
  function standaloneSVG() {
    var svg = preview.querySelector('mjx-container svg');
    if (!svg) return Promise.reject(new Error('no equation'));
    var box = svg.getBoundingClientRect();
    var clone = svg.cloneNode(true);
    var mirrored = svg.style.transform.indexOf('scaleX(-1)') >= 0;
    clone.removeAttribute('style');
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    clone.setAttribute('width', box.width);
    clone.setAttribute('height', box.height);
    clone.setAttribute('color', '#000000');
    if (mirrored) {
      var vb = clone.getAttribute('viewBox').split(/\s+/).map(Number);
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', 'translate(' + (2 * vb[0] + vb[2]) + ',0) scale(-1,1)');
      Array.prototype.slice.call(clone.childNodes).forEach(function (n) {
        if (n.nodeName.toLowerCase() !== 'defs') g.appendChild(n);
      });
      clone.appendChild(g);
    }
    return embeddedFonts().then(function (css) {
      if (css) {
        var style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
        style.textContent = css;
        clone.insertBefore(style, clone.firstChild);
      }
      return { text: new XMLSerializer().serializeToString(clone), w: box.width, h: box.height, fonts: !!css };
    });
  }

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  function saveSVG() {
    status.textContent = 'جارٍ التجهيز...';
    standaloneSVG().then(function (s) {
      download(new Blob([s.text], { type: 'image/svg+xml' }), 'equation.svg');
      status.textContent = s.fonts ? '' : 'حُفظت الصورة دون الخطوط المضمّنة';
    }).catch(function () { status.textContent = 'لا توجد معادلة لحفظها'; });
  }

  function savePNG() {
    status.textContent = 'جارٍ التجهيز...';
    standaloneSVG().then(function (s) {
      var scale = 3, pad = 12;
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = Math.ceil((s.w + 2 * pad) * scale); c.height = Math.ceil((s.h + 2 * pad) * scale);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, pad * scale, pad * scale, s.w * scale, s.h * scale);
        c.toBlob(function (b) {
          download(b, 'equation.png');
          status.textContent = s.fonts ? '' : 'حُفظت الصورة دون الخطوط المضمّنة';
        }, 'image/png');
      };
      img.onerror = function () { status.textContent = 'تعذّر إنشاء الصورة'; };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.text);
    }).catch(function () { status.textContent = 'لا توجد معادلة لحفظها'; });
  }

  document.getElementById('png').addEventListener('click', savePNG);
  document.getElementById('svgdl').addEventListener('click', saveSVG);

  window.ArabicConvert = convert;   // for testing
  window.ArabicStandaloneSVG = standaloneSVG;
  (function waitReady() {
    if (document.documentElement.getAttribute('data-math-ready')) update();
    else setTimeout(waitReady, 100);
  })();
})();
</script>
</body>
</html>

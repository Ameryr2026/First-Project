<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محرر الرياضيات العربية · عامر الرواشدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Math&display=swap" rel="stylesheet">

<script>
  // The Latin letter for each Arabic letter (Latin view). Editable on the page; kept in this browser.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('editor-latin-map'); } catch (e) {}
    // Standard letters come from arabic-math.js; only an edited mapping is applied here.
    var text = saved || '';
    var map = {};
    text.split(/\s+/).forEach(function (pair) {
      var p = pair.split('=');
      if (p.length === 2 && p[0] && p[1]) {
        if (p[0] === 'هـ') { map['ه'] = p[1]; map['ـ'] = ''; } else map[p[0]] = p[1];
      }
    });
    window.ArabicMathLatin = map;
    window.EditorLatinMapText = text;
  })();
</script>
<script src="arabic-math.js?v=17"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

<style>
  :root {
    --bg: #fbfaf7; --text: #1f2328; --muted: #5b6470;
    --accent: #0c4a6e; --rule: #e3e0d8; --box: #f2f0ea; --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171b; --text: #e6e6e3; --muted: #a0a7b0;
            --accent: #7cc4ec; --rule: #2a2f36; --box: #1c2026; --field: #101317; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Noto Naskh Arabic", "Amiri", serif; font-size: 19px; line-height: 1.9;
         display: flex; flex-direction: column; }
  a { color: var(--accent); text-decoration: none; }
  nav { border-bottom: 1px solid var(--rule); font-size: 15px; flex: none; }
  nav .inner { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  nav .home { font-weight: 700; color: var(--text); }
  nav .title { color: var(--muted); margin-left: auto; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px;
           border-bottom: 1px solid var(--rule); font-size: 14px; flex: none; }
  .tools button { font: inherit; color: var(--text); background: var(--box); border: 1px solid var(--rule);
                  border-radius: 6px; padding: 2px 12px; cursor: pointer; }
  .tools button:hover { border-color: var(--accent); }
  .tools label { color: var(--muted); }
  .tools input { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--rule);
                 border-radius: 6px; padding: 2px 8px; width: min(420px, 100%); }
  .status { color: var(--muted); margin-right: auto; }
  .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  textarea { width: 100%; height: 100%; resize: none; border: 0; border-left: 1px solid var(--rule);
             padding: 16px; background: var(--field); color: var(--text);
             font-family: "Noto Naskh Arabic", "Amiri", serif; font-size: 19px; line-height: 1.9; outline: none; }
  #preview { padding: 16px 24px 60px; overflow: auto; }
  .src-wrap { position: relative; min-height: 0; }
  #suggest { position: absolute; z-index: 20; min-width: 220px; max-width: 320px; margin: 0; padding: 4px 0;
             list-style: none; background: var(--field); border: 1px solid var(--rule); border-radius: 8px;
             box-shadow: 0 6px 20px rgba(0,0,0,.15); font-size: 16px; line-height: 1.6; }
  #suggest[hidden] { display: none; }
  #suggest li { display: flex; justify-content: space-between; gap: 16px; padding: 2px 12px; cursor: pointer; }
  #suggest li.on { background: var(--box); }
  #suggest li .tex { direction: ltr; unicode-bidi: isolate; color: var(--muted); font-family: ui-monospace, monospace;
                     font-size: 13px; }
  #suggest .hint { padding: 2px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule);
                   margin-top: 2px; cursor: default; }
  #preview p { margin: 0 0 14px; }
  .help { font-size: 15px; color: var(--muted); }
  .help code { direction: rtl; unicode-bidi: isolate; background: var(--box); padding: 0 4px; border-radius: 4px; }
  /* PDF: print only the finished preview */
  @media print {
    @page { margin: 18mm 16mm; }
    html, body { height: auto; background: #fff; color: #000; display: block; }
    nav, .tools, .src-wrap, #suggest { display: none !important; }
    .panes { display: block; }
    #preview { padding: 0; overflow: visible; font-size: 13pt; line-height: 1.9; }
    #preview p { break-inside: avoid; }
    mjx-container[jax="SVG"][display="true"] { overflow: visible !important; break-inside: avoid; }
  }
  @media (max-width: 760px) {
    body { height: auto; }
    .panes { grid-template-columns: 1fr; }
    textarea { height: 45vh; border-left: 0; border-bottom: 1px solid var(--rule); }
  }
</style>
</head>
<body>

<nav>
  <div class="inner">
    <a class="home" href="../index.html">عامر الرواشدة</a>
    <span class="title">محرر الرياضيات العربية</span>
    <a href="commands.html">الأوامر</a>
    <a href="converter.html">المحوّل</a>
  </div>
</nav>

<div class="tools">
  <button type="button" id="copy">نسخ النص</button>
  <button type="button" id="example">مثال</button>
  <button type="button" id="clear">مسح</button>
  <button type="button" id="pdf">PDF</button>
  <label for="map">الحروف اللاتينية:</label>
  <input id="map" dir="rtl" spellcheck="false" aria-label="الحرف اللاتيني المقابل لكل حرف عربي">
  <span class="status" id="status"></span>
</div>

<div class="panes">
  <div class="src-wrap">
    <textarea id="src" dir="rtl" spellcheck="false" aria-label="النص" aria-autocomplete="list"
              aria-controls="suggest"></textarea>
    <ul id="suggest" role="listbox" hidden></ul>
  </div>
  <div id="preview" aria-live="polite"></div>
</div>

<script>
(function () {
  var src = document.getElementById('src');
  var preview = document.getElementById('preview');
  var status = document.getElementById('status');
  var mapBox = document.getElementById('map');

  var EXAMPLE =
    'إذا كانت $ق(س) = س^2 + 3$ فإن $ق(2) = 7$.\n\n' +
    'نهاية دالة:\n' +
    '$$\\نها_{س \\الى 3} \\كسر{س^2 - 9}{س - 3} = 6$$\n\n' +
    'تكامل ومجموع:\n' +
    '$$\\تكامل_0^1 س^2 \\, دس = \\كسر{1}{3}, \\qquad \\مجموع_{ن=1}^{\\لانهاية} \\كسر{1}{ن^2} = \\كسر{\\باي^2}{6}$$\n\n' +
    'مشتقة جزئية:\n' +
    '$$\\جزئية{ع}{ز} - \\لابلاس ع = 0$$';

  function load() {
    try { return localStorage.getItem('editor-text'); } catch (e) { return null; }
  }
  function save(t) {
    try { localStorage.setItem('editor-text', t); } catch (e) {}
  }

  // Paragraphs are separated by blank lines. Text is inserted as text (never as HTML).
  function render() {
    var text = src.value;
    save(text);
    if (!window.ArabicMath || !window.MathJax || !MathJax.typesetClear) return;
    MathJax.typesetClear([preview]);
    preview.textContent = '';
    text.split(/\n\s*\n/).forEach(function (para) {
      if (!para.trim()) return;
      var p = document.createElement('p');
      p.textContent = para;
      preview.appendChild(p);
    });
    if (!text.trim()) {
      var h = document.createElement('p');
      h.className = 'help';
      h.textContent = 'اكتب في المربع. الرياضيات بين $...$ داخل السطر، أو $$...$$ في سطر مستقل. ' +
        'الأوامر بأسماء عربية: \\كسر{أ}{ب}، \\جذر{س}، \\نها_{س \\الى 0}، \\تكامل، \\مجموع ...';
      preview.appendChild(h);
    }
    ArabicMath.typeset(preview).then(function () {
      var errs = preview.querySelectorAll('[data-mjx-error]');
      status.textContent = errs.length ? ('خطأ: ' + errs[0].getAttribute('data-mjx-error')) : '';
    }).catch(function (e) { status.textContent = 'خطأ: ' + e.message; });
  }

  var timer = null;
  src.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(render, 350);
  });

  document.getElementById('copy').addEventListener('click', function () {
    var done = function () { status.textContent = 'تم النسخ'; setTimeout(function () { status.textContent = ''; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(src.value).then(done, function () { src.select(); });
    else { src.select(); document.execCommand('copy'); done(); }
  });
  document.getElementById('example').addEventListener('click', function () { src.value = EXAMPLE; render(); });
  document.getElementById('pdf').addEventListener('click', function () {
    status.textContent = 'اختر «حفظ كـ PDF» من نافذة الطباعة';
    setTimeout(function () { window.print(); status.textContent = ''; }, 50);
  });
  document.getElementById('clear').addEventListener('click', function () { src.value = ''; render(); src.focus(); });

  // Letter map: changing it reloads the page so the Latin view uses the new letters.
  mapBox.value = window.EditorLatinMapText || Object.keys(ArabicMath.letters).map(function (l) {
    return ArabicMath.letters[l] + '=' + l;
  }).join(' ');
  mapBox.addEventListener('change', function () {
    try { localStorage.setItem('editor-latin-map', mapBox.value.trim()); } catch (e) {}
    if (window.ArabicMath && ArabicMath.mode === 'latin') location.reload();
  });

  // ---------- Command suggestions: type \ and a few letters, then Tab ----------
  // How a command is inserted: | marks where the cursor goes.
  var SHAPE = {
    'كسر': '{|}{}', 'جذر': '{|}', 'نص': '{|}', 'مشتقة': '{|}{}', 'جزئية': '{|}{}',
    'نظيم': '{|}', 'مطلق': '{|}', 'نها': '_{|}', 'نهاية': '_{|}',
    'frac': '{|}{}', 'sqrt': '{|}', 'text': '{|}', 'lim': '_{|}', 'mathbb': '{|}', 'mathbf': '{|}',
    'begin': '{|}', 'end': '{|}', 'left': '|', 'right': '|'
  };
  var LATIN_CMDS = ['frac', 'sqrt', 'sum', 'prod', 'int', 'iint', 'oint', 'lim', 'infty', 'partial', 'nabla',
    'cdot', 'times', 'pm', 'le', 'ge', 'ne', 'approx', 'in', 'notin', 'subset', 'subseteq', 'cup', 'cap',
    'to', 'Rightarrow', 'Leftrightarrow', 'forall', 'exists', 'left', 'right', 'text', 'mathbb', 'mathbf',
    'alpha', 'beta', 'gamma', 'delta', 'varepsilon', 'theta', 'lambda', 'mu', 'pi', 'sigma', 'varphi',
    'omega', 'Delta', 'Omega', 'quad', 'qquad', 'begin', 'end'];
  function norm(w) { return w.replace(/[أإآ]/g, 'ا').replace(/ـ/g, ''); }
  var ITEMS = [];
  function buildItems() {
    ITEMS = [];
    var ar = (window.ArabicMath && ArabicMath.commands) || {};
    Object.keys(ar).forEach(function (k) { ITEMS.push({ name: k, key: norm(k), tex: ar[k] }); });
    LATIN_CMDS.forEach(function (k) { ITEMS.push({ name: k, key: k, tex: '' }); });
    // Environments: typing \مصف offers a whole \بداية{مصفوفة} ... \نهاية{مصفوفة} block.
    var envs = (window.ArabicMath && ArabicMath.environments) || {};
    Object.keys(envs).forEach(function (a) {
      ITEMS.push({ name: a, key: norm(a), tex: envs[a], env: true });
    });
  }

  var box = document.getElementById('suggest');
  var matches = [], active = 0, tokenStart = -1;

  // Where is the cursor on screen? Copy the textarea's text into a hidden twin and measure.
  function caretXY() {
    var cs = getComputedStyle(src), m = document.createElement('div');
    ['direction', 'fontFamily', 'fontSize', 'lineHeight', 'paddingTop', 'paddingRight', 'paddingBottom',
     'paddingLeft', 'borderTopWidth', 'borderRightWidth', 'borderLeftWidth', 'letterSpacing', 'wordSpacing',
     'boxSizing'].forEach(function (p) { m.style[p] = cs[p]; });
    m.style.position = 'absolute'; m.style.visibility = 'hidden'; m.style.whiteSpace = 'pre-wrap';
    m.style.wordWrap = 'break-word'; m.style.width = src.clientWidth + 'px'; m.style.top = '0'; m.style.left = '-9999px';
    m.textContent = src.value.slice(0, src.selectionStart);
    var mark = document.createElement('span'); mark.textContent = '​'; m.appendChild(mark);
    document.body.appendChild(m);
    var r = mark.getBoundingClientRect(), mr = m.getBoundingClientRect();
    var x = r.left - mr.left, y = r.top - mr.top + r.height;
    document.body.removeChild(m);
    return { x: x, y: y - src.scrollTop };
  }

  function closeSuggest() { box.hidden = true; matches = []; tokenStart = -1; }

  function updateSuggest() {
    var pos = src.selectionStart;
    var before = src.value.slice(0, pos);
    var m = before.match(/\\([ء-يـA-Za-z]*)$/);
    if (!m || src.selectionStart !== src.selectionEnd) return closeSuggest();
    if (!ITEMS.length) buildItems();
    var typed = norm(m[1]);
    tokenStart = pos - m[0].length;
    matches = ITEMS.filter(function (it) { return it.key.indexOf(typed) === 0 && it.key !== typed; })
      .sort(function (a, b) { return a.key.length - b.key.length; }).slice(0, 8);
    if (!matches.length) return closeSuggest();
    active = 0;
    box.textContent = '';
    matches.forEach(function (it, i) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      if (i === active) li.className = 'on';
      var n = document.createElement('span'); n.textContent = it.env ? ('\\بداية{' + it.name + '}') : ('\\' + it.name);
      var t = document.createElement('span'); t.className = 'tex'; t.textContent = it.tex || '';
      li.appendChild(n); li.appendChild(t);
      li.addEventListener('mousedown', function (e) { e.preventDefault(); accept(i); });
      box.appendChild(li);
    });
    var hint = document.createElement('li'); hint.className = 'hint';
    hint.textContent = 'Tab أو Enter للإكمال · Esc للإغلاق';
    box.appendChild(hint);
    var xy = caretXY();
    box.hidden = false;
    var left = Math.max(4, Math.min(xy.x - box.offsetWidth, src.clientWidth - box.offsetWidth - 4));
    box.style.left = left + 'px';
    box.style.top = Math.min(xy.y + 4, src.clientHeight - box.offsetHeight - 4) + 'px';
  }

  function highlight(i) {
    active = (i + matches.length) % matches.length;
    var lis = box.querySelectorAll('li[role="option"]');
    for (var k = 0; k < lis.length; k++) lis[k].className = k === active ? 'on' : '';
  }

  function accept(i) {
    var it = matches[i];
    if (!it) return closeSuggest();
    var insert, caret;
    if (it.env) {
      var head = '\\بداية{' + it.name + '}' + (it.tex === 'array' ? '{cc}' : '') + ' ';
      insert = head + ' \\نهاية{' + it.name + '}';
      caret = tokenStart + head.length;
    } else {
      var shape = SHAPE[it.name] || ' |';
      insert = '\\' + it.name + shape.replace('|', '');
      caret = tokenStart + ('\\' + it.name).length + shape.indexOf('|');
    }
    var end = src.selectionStart;
    src.value = src.value.slice(0, tokenStart) + insert + src.value.slice(end);
    src.setSelectionRange(caret, caret);
    closeSuggest();
    src.focus();
    clearTimeout(timer); timer = setTimeout(render, 350);
  }

  src.addEventListener('keydown', function (e) {
    if (box.hidden) return;
    if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); accept(active); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); highlight(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight(active - 1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeSuggest(); }
  });
  src.addEventListener('input', updateSuggest);
  src.addEventListener('click', updateSuggest);
  src.addEventListener('blur', function () { setTimeout(closeSuggest, 150); });
  src.addEventListener('scroll', closeSuggest);

  src.value = load();
  if (src.value === null || src.value === '') src.value = EXAMPLE;

  // First render once MathJax and the Arabic math layer are ready.
  (function waitReady() {
    if (document.documentElement.getAttribute('data-math-ready')) { render(); src.focus(); }
    else setTimeout(waitReady, 100);
  })();
})();
</script>
</body>
</html>
